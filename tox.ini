[tox]
min_version = 4.4
envlist =
    py311-djqa
    py311-dj{41,42}
    py312-djmain

[gh-actions]
python =
    3.11: py311
    3.12: py312

[gh-actions:env]
DJANGO =
    4.1: dj41
    4.2: dj42
    main: djmain
    qa: djqa

[testenv]
usedevelop = true
constrain_package_deps = true
setenv =
    PYTHONDONTWRITEBYTECODE=1
deps =
    coverage==7.3.2
    dj41: django>=4.1.3,<4.2
    dj42: django>=4.2,<4.3
    djmain: django @ https://github.com/django/django/archive/main.tar.gz
commands =
    python -m django --version
    coverage run -m django test django_ical --settings=test_settings
    coverage report -m

[testenv:py311-djqa]
ignore_errors = true
skip_install = true
setenv =
    DJANGO_SETTINGS_MODULE=test_settings
deps =
    django>=4.2,<4.3
    black==23.10.1
    prospector==1.19.1
commands =
    prospector
    black --check --diff django_ical
